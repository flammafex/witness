[package]
name = "witness-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed client SDK for the Witness timestamping network"
repository.workspace = true
homepage.workspace = true
keywords = ["timestamp", "client", "witness", "sdk", "verification"]
categories = ["cryptography", "web-programming::http-client"]

[features]
default = []
# WebSocket push events (`subscribe_events`).
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
# Low-noise structured logging on the client.
tracing = ["dep:tracing"]

[dependencies]
witness-core.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tower.workspace = true
