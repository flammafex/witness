[package]
name = "witness-core-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM export surface for witness-core verification (single trust root for @witness/sdk)"
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Disable the `keygen` feature: verification never needs `OsRng`, and doing so
# avoids the `getrandom` wasm32-unknown-unknown limitation entirely. Referenced
# by path (not `.workspace = true`) so `default-features` can be overridden.
witness-core = { path = "../witness-core", version = "0.8.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
